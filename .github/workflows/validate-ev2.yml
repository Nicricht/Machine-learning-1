name: Ejecutar y validar Evaluación Parcial 2

on:
  push:
    branches:
      - evaluacion-parcial-2
    paths:
      - '.github/workflows/validate-ev2.yml'
      - 'notebook/evaluacion_parcial_2.ipynb'

permissions:
  contents: read

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: evaluacion-parcial-2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbclient ipykernel

      - name: Simular un Colab nuevo sin archivo de datos cargado
        run: |
          rm -f "Evaluación Parcial 1 - Dataset.zip"
          test ! -f "Evaluación Parcial 1 - Dataset.zip"

      - name: Ejecutar todas las celdas
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=1800 \
            --ExecutePreprocessor.cwd=. \
            notebook/evaluacion_parcial_2.ipynb

      - name: Guardar notebook ejecutado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: evaluacion-parcial-2-ejecutada
          path: notebook/evaluacion_parcial_2.ipynb
          if-no-files-found: error
          retention-days: 7
