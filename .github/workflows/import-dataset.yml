name: Import dataset source

on:
  push:
    paths:
      - ".github/workflows/import-dataset.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download candidate Properati dataset
        run: |
          curl -L --fail --retry 3             "https://raw.githubusercontent.com/cnexans/properati-price-inference/master/properati.zip"             -o /tmp/properati-source.zip
          unzip -l /tmp/properati-source.zip

      - name: Verify dataset content
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/properati
          unzip -q /tmp/properati-source.zip -d /tmp/properati
          DATASET="$(find /tmp/properati -type f -iname '*.csv' | head -n 1)"
          if [ -z "$DATASET" ]; then
            echo "No CSV found in source archive"
            exit 1
          fi
          echo "Candidate: $DATASET"
          HASH="$(sha256sum "$DATASET" | awk '{print $1}')"
          echo "SHA256: $HASH"
          test "$HASH" = "2446c511f6841fc13f30b09438e84307deb1e6b22883d6c551923a421712807f"

      - name: Build course dataset archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/course-dataset
          DATASET="$(find /tmp/properati -type f -iname '*.csv' | head -n 1)"
          cp "$DATASET" "/tmp/course-dataset/DS1-18-Datos-Properati.csv"
          cd /tmp/course-dataset
          zip -9 "/tmp/Evaluación Parcial 1 - Dataset.zip" "DS1-18-Datos-Properati.csv"
          sha256sum "/tmp/Evaluación Parcial 1 - Dataset.zip"

      - name: Add dataset archive to repository
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/Evaluación Parcial 1 - Dataset.zip" "./Evaluación Parcial 1 - Dataset.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Evaluación Parcial 1 - Dataset.zip"
          if git diff --cached --quiet; then
            echo "Dataset already present"
            exit 0
          fi
          git commit -m "Agregar dataset de la evaluación"
          git push
